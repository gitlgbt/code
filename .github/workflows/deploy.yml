name: Deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_OPTS: -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o IdentitiesOnly=yes
      HOST: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
      APP: ~/forgejo
      REMOTE: ~/forgejo/forgejo/gitea
      SITE_URL: https://git.lgbt
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: |
          bun install
          bun run bundle

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Forgejo
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh $SSH_OPTS $HOST "mkdir -p $APP"
          ssh $SSH_OPTS $HOST "cat > $APP/docker-compose.yml" < deploy/docker-compose.yml
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" | ssh $SSH_OPTS $HOST "cat > $APP/.env && chmod 600 $APP/.env"
          ssh $SSH_OPTS $HOST "cd $APP && docker compose pull && docker compose up -d"

      - name: Deploy
        run: |
          ssh $SSH_OPTS $HOST "rm -rf $REMOTE/templates.new $REMOTE/assets.new && mkdir -p $REMOTE/templates.new $REMOTE/assets.new $REMOTE/public"
          tar -C dist/forgejo/templates -cf - . | ssh $SSH_OPTS $HOST "tar -C $REMOTE/templates.new -xf -"
          tar -C dist/forgejo/public/assets -cf - . | ssh $SSH_OPTS $HOST "tar -C $REMOTE/assets.new -xf -"
          # swap in the new versions (old files are deleted) and restart
          ssh $SSH_OPTS $HOST "rm -rf $REMOTE/templates $REMOTE/public/assets && mv $REMOTE/templates.new $REMOTE/templates && mv $REMOTE/assets.new $REMOTE/public/assets && cd $APP && docker restart forgejo"

      - name: Test deploy
        run: |
          for p in / /explore/repos /explore/users /user/login /user/sign_up; do
            curl -fsS -o /dev/null --retry 20 --retry-delay 3 --retry-connrefused "$SITE_URL$p" || { echo "FAILED: $p"; exit 1; }
          done
          echo "OK"