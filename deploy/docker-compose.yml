services:
  server:
    image: codeberg.org/forgejo/forgejo:16.0.3
    container_name: forgejo
    restart: always
    env_file:
      - ./forgejo.env
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ./forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"