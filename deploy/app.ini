APP_NAME = GItlgbt
RUN_MODE = prod
APP_SLOGAN = gitlgbt
RUN_USER = git
WORK_PATH = /data/gitea

[database]
DB_TYPE = mysql
HOST = 10.0.0.150:3306
NAME = forgejo_db
USER = forgejo
PASSWD = ${DB_PASSWORD}

[server]
DOMAIN = git.lgbt
ROOT_URL = https://git.lgbt/
SSH_DOMAIN = git.lgbt
SSH_PORT = 222
LANDING_PAGE = home

[ui]
THEMES = github-auto,github-light,github-dark,forgejo-auto,forgejo-light,forgejo-dark
DEFAULT_THEME = github-auto
CUSTOM_EMOJIS = party, blobcat, github, gitlgbt, git, codeberg

[repository]
ROOT = /data/git/repositories

[repository.local]
LOCAL_COPY_PATH = /data/gitea/tmp/local-repo

[repository.upload]
TEMP_PATH = /data/gitea/uploads

[picture]
AVATAR_UPLOAD_PATH = /data/gitea/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /data/gitea/repo-avatars

[attachment]
PATH = /data/gitea/attachments


[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = true
ENABLE_NOTIFY_MAIL = true
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_CAPTCHA = true
DEFAULT_KEEP_EMAIL_PRIVATE = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true
NO_REPLY_ADDRESS = noreply.git.lgbt
